server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Health endpoint for Docker / load balancers
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Vite file names contain a content hash (index-B4cnf8GK.js) -> safe to cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SINGLE-PAGE APP FALLBACK: /dashboard or /agency/prime-estate are React routes, not files.
  # Without this, refreshing the page would give nginx's 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}